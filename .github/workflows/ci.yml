name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: server

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

  build-and-test:
    # Tests only run once the code passes lint.
    needs: lint
    runs-on: ubuntu-latest

    # The API tests need a real MongoDB; GitHub starts this container next to the job.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run API tests
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/awdf_p12_test
